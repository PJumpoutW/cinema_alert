name: CGV 예매 오픈 감시

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check CGV booking status and notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          cat > check_cgv.js << 'SCRIPT_EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          // 지점명 -> CGV 내부 siteNo. 추가하려면 여기에 한 줄 더.
          const SITES = {
            '용산': '0013',
            '영등포': '0059',
          };
          const KEYWORDS_FILE = 'keywords.txt';
          const STATE_FILE = 'cgv_state.json';

          function loadKeywords() {
            if (!fs.existsSync(KEYWORDS_FILE)) return [];
            return fs.readFileSync(KEYWORDS_FILE, 'utf8')
              .split('\n').map(s => s.trim()).filter(Boolean);
          }

          (async () => {
            const keywords = loadKeywords();
            if (keywords.length === 0) {
              console.log('keywords.txt에 감시할 키워드가 없음. 종료.');
              return;
            }

            const browser = await chromium.launch();
            const page = await browser.newPage({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
            });

            // Cloudflare는 순수 curl을 차단함 (직접 확인함) — 실제 페이지를 먼저 띄워서
            // Cloudflare를 통과한 뒤, 그 페이지 컨텍스트 안에서 fetch를 실행해야 함.
            try {
              await page.goto('https://cgv.co.kr', { waitUntil: 'domcontentloaded', timeout: 30000 });
            } catch (e) {
              await page.screenshot({ path: 'failure.png', fullPage: true }).catch(() => {});
              fs.writeFileSync('failure.html', await page.content().catch(() => ''));
              await browser.close();
              throw e;
            }

            // 전체 무비차트(상영중+상영예정 중 예매 활동 있는 작품) 목록 — 여기서 제목으로 movNo를 찾음.
            const chart = await page.evaluate(async () => {
              const r = await fetch('https://cgv.co.kr/api/v1/booking/searchAtktTopPostrList?coCd=A420');
              return (await r.json()).data || [];
            });

            const state = fs.existsSync(STATE_FILE) ? JSON.parse(fs.readFileSync(STATE_FILE, 'utf8')) : {};
            let stateChanged = false;

            for (const keyword of keywords) {
              const movie = chart.find(m => m.movNm.includes(keyword));
              if (!movie) {
                console.log(`"${keyword}": 아직 CGV 차트에 없음 (예매 활동 전) — 스킵`);
                continue;
              }

              for (const [siteName, siteNo] of Object.entries(SITES)) {
                const stateKey = `${keyword}|${siteName}`;
                const alreadyOpen = state[stateKey] === true;
                if (alreadyOpen) continue; // 이미 알림 보낸 조합은 다시 안 봄

                const dates = await page.evaluate(async ({ movNo, siteNo }) => {
                  const r = await fetch(`https://cgv.co.kr/api/v1/booking/searchSiteScnscYmdListByMov?coCd=A420&movNo=${movNo}&siteNo=${siteNo}`);
                  return (await r.json()).data || [];
                }, { movNo: movie.movNo, siteNo });

                if (dates.length > 0) {
                  console.log(`"${keyword}" @ CGV ${siteName}: 예매 오픈 확인 (${dates.length}개 상영일)`);
                  const content = `🎬 예매 오픈!\n영화: ${movie.movNm}\n극장: CGV ${siteName}\n상영 시작일: ${dates[0].scnYmd}`;
                  const res = await fetch(process.env.DISCORD_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                  });
                  console.log('Discord 응답 상태:', res.status);
                  state[stateKey] = true;
                  stateChanged = true;
                } else {
                  console.log(`"${keyword}" @ CGV ${siteName}: 아직 미오픈`);
                }
              }
            }

            await browser.close();
            if (stateChanged) fs.writeFileSync(STATE_FILE, JSON.stringify(state, null, 2));
          })();
          SCRIPT_EOF
          node check_cgv.js

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cgv-failure-evidence
          path: |
            failure.png
            failure.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit updated state
        run: |
          if [ -n "$(git status --porcelain cgv_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add cgv_state.json
            git commit -m "chore: update CGV booking state"
            git push
          else
            echo "상태 변경 없음"
          fi
