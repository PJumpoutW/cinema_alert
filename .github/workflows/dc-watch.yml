name: DC 오티켓 개봉예정작 리스트 감시

on:
  schedule:
    - cron: '7 * * * *'   # 매시간 정각 7분(UTC) — 시간대와 무관하게 매시간 1회
  workflow_dispatch: {}    # GitHub 화면에서 수동 실행(Run workflow) 버튼도 사용 가능

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check gallery and notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          cat > check.js << 'SCRIPT_EOF'
          const { chromium } = require('playwright');

          const SEARCH_URL = 'https://gall.dcinside.com/mgallery/board/lists?id=oticket&s_type=search_subject_memo&s_keyword=%EA%B0%9C%EB%B4%89%20%EC%98%88%EC%A0%95%20%EC%98%81%ED%99%94%20%EB%A6%AC%EC%8A%A4%ED%8A%B8';
          const WINDOW_MINUTES = 75; // 매시간 실행 + 여유 버퍼(스케줄 지연 대비)

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
            });
            await page.goto(SEARCH_URL, { waitUntil: 'networkidle', timeout: 30000 });

            // 검색결과 테이블은 id="kakao_seach_list" 로 고정 (직접 확인함)
            const rows = await page.$$eval('#kakao_seach_list tbody tr', trs => trs.map(tr => {
              const titA = tr.querySelector('td.gall_tit a');
              const dateEl = tr.querySelector('td.gall_date');
              if (!titA || !dateEl) return null;
              const title = titA.textContent.trim();
              const isoDate = dateEl.getAttribute('title'); // 예: "2026-08-22 00:16:23" (정확한 전체 타임스탬프)
              if (!title || !isoDate) return null;
              const href = titA.getAttribute('href') || '';
              const m = href.match(/no=(\d+)/);
              const no = m ? m[1] : null;
              return { title, isoDate, no };
            }).filter(Boolean));

            await browser.close();

            const candidates = rows.filter(r =>
              r.title.includes('개봉') && r.title.includes('예정') && r.title.includes('리스트')
            );

            const nowMs = Date.now();
            const fresh = candidates.filter(r => {
              // isoDate는 한국시간(KST) 기준 "YYYY-MM-DD HH:MM:SS" 문자열 → UTC로 명시 변환해서 비교
              const postMs = Date.parse(r.isoDate.replace(' ', 'T') + '+09:00');
              if (Number.isNaN(postMs)) return false;
              const diffMin = (nowMs - postMs) / 60000;
              return diffMin >= 0 && diffMin <= WINDOW_MINUTES;
            });

            if (fresh.length === 0) {
              console.log('새 글 없음. 종료.');
              return;
            }

            for (const post of fresh) {
              const link = post.no
                ? `https://gall.dcinside.com/mgallery/board/view/?id=oticket&no=${post.no}`
                : SEARCH_URL;
              const content = `🎬 새 개봉 예정작 리스트 글이 올라왔습니다!\n제목: ${post.title}\n작성시각: ${post.isoDate}\n링크: ${link}`;
              const res = await fetch(process.env.DISCORD_WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
              });
              console.log('Discord 응답 상태:', res.status);
            }
          })();
          SCRIPT_EOF
          node check.js
